name: Preview

# A protected Vercel preview of each PR, against the staging database, so it can be
# tried (and attacked without breaking data) before merging (SPEC §17). Migrations are
# not run: staging keeps main's schema until the PR merges.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  # The Playwright image tag follows the @playwright/test version in bun.lock, so a
  # Dependabot bump needs no manual edit here. The image already carries WebKit and its
  # system libraries: no apt-get at run time (it used to hang for 10 minutes).
  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: bun.lock
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          version=$(grep -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$version" ] || { echo "::error::@playwright/test not found in bun.lock"; exit 1; }
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  preview:
    # Secrets never reach PRs from forks, nor Dependabot's: without the Vercel token the
    # deploy can only fail, so those PRs skip the preview (CI still runs their E2E locally).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: playwright-image
    runs-on: ubuntu-latest
    container: ${{ needs.playwright-image.outputs.image }}
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # setup-bun needs unzip, which the Playwright image lacks (and installing it would
      # bring apt back): Bun's npm package ships the same binary. Keep in step with
      # packageManager in package.json.
      - run: npm install -g bun@1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Deploy preview to Vercel
        id: deploy
        run: |
          # Built on Vercel with its Preview variables (staging Supabase).
          url=$(bunx vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview de este PR (protegida, Supabase de staging, sin las migraciones del PR): $URL — commit ${SHA::7}"
          # One comment per PR, updated on every push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview de este PR")))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
      - name: E2E against the preview
        run: bun run e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Only the page snapshots: traces would carry the Vercel bypass header.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-e2e-context
          path: apps/web/test-results/**/error-context.md
