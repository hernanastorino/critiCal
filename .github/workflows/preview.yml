name: Preview

# A protected Vercel preview of each PR, against the staging database, so it can be
# tried (and attacked without breaking data) before merging (SPEC §17). Migrations are
# not run: staging keeps main's schema until the PR merges.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  preview:
    # Secrets never reach PRs from forks, nor Dependabot's: without the Vercel token the
    # deploy can only fail, so those PRs skip the preview (CI still runs their E2E locally).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy preview to Vercel
        id: deploy
        run: |
          # Built on Vercel with its Preview variables (staging Supabase).
          url=$(npx vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview de este PR (protegida, Supabase de staging, sin las migraciones del PR): $URL — commit ${SHA::7}"
          # One comment per PR, updated on every push.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("Preview de este PR")))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright WebKit
        timeout-minutes: 12
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          # The download has hung for 10+ minutes before: bound each attempt and retry once.
          if [ "$CACHE_HIT" = "true" ]; then
            cmd="npx playwright install-deps webkit"
          else
            cmd="npx playwright install --with-deps webkit"
          fi
          for attempt in 1 2; do
            timeout 300 $cmd && exit 0
            echo "Attempt $attempt failed or timed out"
            # A killed run leaves apt/dpkg holding the lock: clean up before retrying.
            sudo pkill apt-get || true
            sudo pkill dpkg || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: E2E against the preview
        run: npm run e2e
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Only the page snapshots: traces would carry the Vercel bypass header.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-e2e-context
          path: apps/web/test-results/**/error-context.md
