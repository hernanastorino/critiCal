name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Playwright image tag follows the @playwright/test version in bun.lock, so a
  # Dependabot bump needs no manual edit here. The image already carries WebKit and its
  # system libraries: no apt-get at run time (it used to hang for 10 minutes).
  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: bun.lock
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          version=$(grep -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$version" ] || { echo "::error::@playwright/test not found in bun.lock"; exit 1; }
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test:coverage
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, playwright-image]
    container: ${{ needs.playwright-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # setup-bun needs unzip, which the Playwright image lacks (and installing it would
      # bring apt back): Bun's npm package ships the same binary. Keep in step with
      # packageManager in package.json.
      - run: npm install -g bun@1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase db start
      - name: Every public table has RLS enabled
        run: |
          missing=$(psql "postgresql://postgres:postgres@127.0.0.1:55322/postgres" -tAc \
            "select string_agg(tablename, ', ') from pg_tables where schemaname = 'public' and not rowsecurity")
          if [ -n "$missing" ]; then echo "::error::Tables without RLS: $missing"; exit 1; fi
      - name: Database tests (RLS isolation, append-only check-ins)
        run: supabase test db
