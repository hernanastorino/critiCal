name: Deploy

on:
  push:
    branches: [main]
    # Docs and Markdown (TODO, SPEC) cannot change the app: no Vercel deploy for them
    # (100 a day on Hobby). A mixed push still deploys. Run it by hand if ever needed.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  # The Playwright image tag follows the @playwright/test version in bun.lock, so a
  # Dependabot bump needs no manual edit here. The image already carries WebKit and its
  # system libraries: no apt-get at run time (it used to hang for 10 minutes).
  playwright-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: bun.lock
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          version=$(grep -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' bun.lock | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$version" ] || { echo "::error::@playwright/test not found in bun.lock"; exit 1; }
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  # Migrate and deploy on the bare runner: supabase/setup-cli needs unzip, which the
  # Playwright image lacks. Only the E2E runs in the image (staging-e2e).
  staging:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Migrate staging database
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_REF }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy preview to Vercel
        id: deploy
        run: |
          # Built on Vercel, which can read Sensitive variables (a CI pull gets them empty).
          url=$(bunx vercel@latest deploy --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  staging-e2e:
    needs: [staging, playwright-image]
    runs-on: ubuntu-latest
    container: ${{ needs.playwright-image.outputs.image }}
    # Jobs in a container default to sh; the steps use bash syntax, as on the bare runner.
    defaults:
      run:
        shell: bash
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # setup-bun needs unzip, which the Playwright image lacks (and installing it would
      # bring apt back): Bun's npm package ships the same binary. Keep in step with
      # packageManager in package.json.
      - run: npm install -g bun@1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: E2E against staging
        run: bun run e2e
        env:
          E2E_BASE_URL: ${{ needs.staging.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  production:
    runs-on: ubuntu-latest
    needs: staging-e2e
    environment:
      name: production
      url: https://critical-cal.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Migrate production database
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_REF }}"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Deploy production to Vercel
        run: |
          bunx vercel@latest deploy --yes --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
