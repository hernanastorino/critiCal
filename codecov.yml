# Coverage is measured by Vitest (unit and component tests); the thresholds that fail CI
# live in vitest.config.ts, so Codecov only reports.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, components, condensed_files"
  require_changes: false

component_management:
  individual_components:
    - component_id: engine
      name: Motor
      paths: ["packages/engine/src/**"]
    - component_id: web
      name: Web
      paths: ["apps/web/src/**"]
    - component_id: api
      name: API
      paths: ["apps/web/api/**"]
